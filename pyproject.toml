[project]
name = "read-datagolf"
version = "0.0.0"
description = "Read DataGolf live model data and upload results to a DFS spreadsheet."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "requests>=2.33.0",
  "beautifulsoup4",
  "selenium",
  "google-api-python-client",
  "oauth2client",
  "jellyfish",
  "python-dotenv",
  "dfs-common",
  "cryptography>=46.0.6",
]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.uv.sources]
dfs-common = { path = "../dfs_common", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty]
