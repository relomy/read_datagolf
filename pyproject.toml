[project]
name = "read-datagolf"
version = "0.0.0"
description = "Read DataGolf live model data and upload results to a DFS spreadsheet."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests",
  "beautifulsoup4",
  "selenium",
  "google-api-python-client",
  "oauth2client",
  "jellyfish",
  "dfs-common",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "ty",
]

[tool.uv]
package = false

[tool.uv.sources]
dfs-common = { path = "../dfs_common" }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dfssheet", "read_datagolf", "test_fixtures", "datagolf_api"]
