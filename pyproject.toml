[project]
name = "read-datagolf"
version = "0.0.0"
description = "Read DataGolf live model data and upload results to a DFS spreadsheet."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "requests>=2.33.0",
  "beautifulsoup4",
  "soupsieve>=2.8.4",
  "selenium",
  "google-api-python-client",
  "oauth2client",
  "jellyfish",
  "python-dotenv>=1.2.2",
  "dfs-common",
  "cryptography>=48.0.1",
  "httplib2>=0.32.0",
  "idna>=3.15",
  "pyasn1>=0.6.4",
  "urllib3>=2.7.0",
]

[dependency-groups]
test = [
    "pytest>=9.0.3",
]
quality = [
    "xenon>=0.9.3",
    "complexity-ratchet",
    "ruff",
    "ty",
]

[tool.uv]
package = true
default-groups = ["test"]

[tool.uv.sources]
dfs-common = { git = "https://github.com/relomy/dfs-common", branch = "main" }
complexity-ratchet = { git = "https://github.com/relomy/complexity-ratchet", tag = "v0.1.0" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty]
