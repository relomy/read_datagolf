[project]
name = "read-datagolf"
version = "0.0.0"
description = "Read DataGolf live model data and upload results to a DFS spreadsheet."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests",
  "beautifulsoup4",
  "selenium",
  "google-api-python-client",
  "oauth2client",
  "jellyfish",
  "dfs-common @ file:///Users/alewando/Documents/Repo/dfs-workspace/dfs_common",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "ty",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dfssheet", "read_datagolf", "test_fixtures", "datagolf_api"]
