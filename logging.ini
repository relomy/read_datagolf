[loggers]
keys=root,urllib3,googleapiclient,google_auth_httplib2

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_urllib3]
level=WARNING
handlers=consoleHandler
qualname=urllib3
propagate=0

[logger_googleapiclient]
level=WARNING
handlers=consoleHandler
qualname=googleapiclient
propagate=0

[logger_google_auth_httplib2]
level=WARNING
handlers=consoleHandler
qualname=google_auth_httplib2
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s %(name)s %(levelname)5s %(message)s
datefmt=%Y-%m-%d %H:%M:%S
